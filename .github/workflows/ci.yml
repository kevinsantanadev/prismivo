name: Qualidade e build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Executar testes unitários
        run: npm run test:unit

      - name: Verificar tipos
        run: npm run typecheck

      - name: Executar lint
        run: npm run lint

      - name: Validar build de produção
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador de teste
        run: npx playwright install --with-deps chromium webkit

      - name: Executar matriz desktop, Android e iOS
        run: npm run test:e2e
